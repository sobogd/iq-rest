<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Indexing policy depends on the host: menus served on our own
         <slug>.iq-rest.com must NOT be indexed (thin/duplicate vs the marketing
         landing), but a restaurant on its OWN custom domain (restaurant.com)
         SHOULD be indexed. Decide synchronously before paint so crawlers always
         see the right directive. Do NOT add a robots.txt Disallow — Google must
         be able to recrawl to drop already-indexed iq-rest.com pages. -->
    <script>
      (function () {
        try {
          var h = location.hostname;
          if (h === "iq-rest.com" || /\.iq-rest\.com$/.test(h)) {
            var m = document.createElement("meta");
            m.name = "robots";
            m.content = "noindex";
            document.head.appendChild(m);
          }
        } catch (e) {}
      })();
    </script>
    <title>Menu</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #000; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #000; z-index: 99999;
      }
      #boot::before {
        content: ""; width: 40px; height: 40px;
        border: 4px solid rgba(255,255,255,.2); border-top-color: #fff;
        border-radius: 50%; animation: bs .9s linear infinite;
      }
      @keyframes bs { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="boot"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
