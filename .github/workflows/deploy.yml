name: Deploy (manual)

# INERT until cutover. Runs ONLY on manual dispatch — never on push — so merging
# to main never touches prod. The old per-repo workflows still own prod until we
# explicitly cut over. Pick a service (or "all") to deploy.
#
# Server layout (unchanged from the legacy deploys):
#   landing          → /home/deploy/apps/iq-rest                  pm2: iq-rest        (Next :8123)
#   dashboard-api    → /home/deploy/apps/iq-rest-dashboard-api    pm2: dashboard-api  (Nest :8130)
#   public-menu-api  → /home/deploy/apps/iq-rest-public-menu-api  pm2: public-menu-api(Nest :8131)
#   dashboard-web    → /home/deploy/apps/iq-rest-dashboard        nginx static (current/ symlink)
#   public-menu      → /home/deploy/apps/iq-rest-public-menu      nginx static (current/ symlink)
#
# Zero-downtime: static deploys upload to releases/<sha> then atomically swap a
# `current` symlink (nginx root must point at .../current — see DEPLOY-RUNBOOK.md);
# Node apps use `pm2 reload` (rolling, zero-downtime when pm2 runs them in cluster
# mode — see ecosystem.prod.config.js + the runbook). `pm2 reload` degrades to a
# graceful restart in fork mode, so this is safe before the cluster switch too.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Which service to deploy
        required: true
        default: none
        type: choice
        options: [none, all, landing, dashboard-api, public-menu-api, dashboard-web, public-menu]
      run_migrations:
        description: Run prisma migrate deploy (dashboard-api owns the schema)
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  PNPM_FILTER_API_DASH: iq-rest-dashboard-api
  PNPM_FILTER_API_MENU: iq-rest-public-menu-api
  PNPM_FILTER_WEB_DASH: iq-rest-dashboard-web
  PNPM_FILTER_WEB_MENU: iq-rest-public-menu
  PNPM_FILTER_LANDING: soqrmenuweb

jobs:
  # ---------------------------------------------------------------- dashboard-api
  dashboard-api:
    if: ${{ inputs.service == 'dashboard-api' || inputs.service == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @iq-rest/db generate
      - run: pnpm --filter $PNPM_FILTER_API_DASH build
      - name: Bundle (self-contained, prod deps)
        run: pnpm --filter $PNPM_FILTER_API_DASH deploy --prod --legacy ./out-dashboard-api
      - name: Optional DB migrate (schema owner)
        if: ${{ inputs.run_migrations }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @iq-rest/db migrate:deploy
      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "out-dashboard-api/*"
          target: "/home/deploy/apps/iq-rest-dashboard-api"
          strip_components: 1
          overwrite: true
      - name: Write .env + reload pm2 (zero-downtime in cluster)
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV: ${{ secrets.ENV_DASHBOARD_API }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          envs: APP_ENV
          script: |
            cd /home/deploy/apps/iq-rest-dashboard-api
            printf '%s' "$APP_ENV" > .env && chmod 600 .env
            pm2 reload dashboard-api --update-env || pm2 start dist/src/main.js --name dashboard-api --time
            pm2 save

  # -------------------------------------------------------------- public-menu-api
  public-menu-api:
    if: ${{ inputs.service == 'public-menu-api' || inputs.service == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # public-menu-api reuses the dashboard-api (superset) Prisma client at runtime.
      - run: pnpm --filter @iq-rest/db generate
      - run: pnpm --filter $PNPM_FILTER_API_MENU build
      - run: pnpm --filter $PNPM_FILTER_API_MENU deploy --prod --legacy ./out-public-menu-api
      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "out-public-menu-api/*"
          target: "/home/deploy/apps/iq-rest-public-menu-api"
          strip_components: 1
          overwrite: true
      - name: Write .env + reload pm2 (zero-downtime in cluster)
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV: ${{ secrets.ENV_PUBLIC_MENU_API }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          envs: APP_ENV
          script: |
            cd /home/deploy/apps/iq-rest-public-menu-api
            printf '%s' "$APP_ENV" > .env && chmod 600 .env
            pm2 reload public-menu-api --update-env || pm2 start dist/main.js --name public-menu-api --time
            pm2 save

  # ---------------------------------------------------------------- dashboard-web
  dashboard-web:
    if: ${{ inputs.service == 'dashboard-web' || inputs.service == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_PUBLIC_MENU_URL: ${{ secrets.VITE_PUBLIC_MENU_URL }}
          VITE_ADMIN_EMAIL_DOMAIN: ${{ secrets.VITE_ADMIN_EMAIL_DOMAIN }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: pnpm --filter $PNPM_FILTER_WEB_DASH build
      - name: Stage bundle as release-<sha>/
        run: mv apps/dashboard-web/dist "release-${GITHUB_SHA}"
      - name: Upload release (into releases/<sha>)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "release-${{ github.sha }}/"
          target: "/home/deploy/apps/iq-rest-dashboard/releases/${{ github.sha }}"
          strip_components: 1
          overwrite: true
      - name: Atomic symlink swap (zero-downtime; nginx root = .../current)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            base=/home/deploy/apps/iq-rest-dashboard
            ln -sfn "$base/releases/${{ github.sha }}" "$base/current.tmp"
            mv -Tf "$base/current.tmp" "$base/current"
            # keep the 5 most recent releases
            ls -1dt "$base"/releases/*/ | tail -n +6 | xargs -r rm -rf

  # ------------------------------------------------------------------ public-menu
  public-menu:
    if: ${{ inputs.service == 'public-menu' || inputs.service == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
        run: pnpm --filter $PNPM_FILTER_WEB_MENU build
      - name: Stage bundle as release-<sha>/
        run: mv apps/public-menu/dist "release-${GITHUB_SHA}"
      - name: Upload release (into releases/<sha>)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "release-${{ github.sha }}/"
          target: "/home/deploy/apps/iq-rest-public-menu/releases/${{ github.sha }}"
          strip_components: 1
          overwrite: true
      - name: Atomic symlink swap (zero-downtime; nginx root = .../current)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            base=/home/deploy/apps/iq-rest-public-menu
            ln -sfn "$base/releases/${{ github.sha }}" "$base/current.tmp"
            mv -Tf "$base/current.tmp" "$base/current"
            ls -1dt "$base"/releases/*/ | tail -n +6 | xargs -r rm -rf

  # ---------------------------------------------------------------------- landing
  landing:
    if: ${{ inputs.service == 'landing' || inputs.service == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          NEXT_PUBLIC_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_MAPS_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: pnpm --filter $PNPM_FILTER_LANDING build
      - name: Bundle (self-contained, prod deps)
        run: pnpm --filter $PNPM_FILTER_LANDING deploy --prod --legacy ./out-landing
      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          source: "out-landing/*"
          target: "/home/deploy/apps/iq-rest"
          strip_components: 1
          overwrite: true
      - name: Write .env + reload pm2 (graceful)
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV: ${{ secrets.ENV_LANDING }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deployer
          key: ${{ secrets.SSH_KEY }}
          envs: APP_ENV
          script: |
            cd /home/deploy/apps/iq-rest
            printf '%s' "$APP_ENV" > .env && chmod 600 .env
            pm2 reload iq-rest --update-env || pm2 start npm --name iq-rest -- start
            pm2 save
